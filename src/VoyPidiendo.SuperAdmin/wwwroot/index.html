<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoyPidiendo · Superadministración</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="users.css"><link rel="stylesheet" href="layout.css"></head>
<body><main class="page"><header><div><span>CONTROL CENTRAL</span><h1>VoyPidiendo</h1><p>Superadministración multiempresa</p></div><button id="logout" class="secondary" hidden>Cerrar sesión</button></header>
<section id="setup" class="card" hidden><h2>Crear Superadministrador inicial</h2><div class="grid"><label>Usuario<input id="setupUser"></label><label>Nombre<input id="setupName"></label><label>Contraseña<input id="setupPassword" type="password"></label><label>Clave inicial<input id="setupKey" type="password"></label></div><button id="createAdmin">Crear Superadministrador</button></section>
<section id="login" class="card" hidden><h2>Ingreso exclusivo</h2><div class="login-row"><label>Usuario<input id="loginUser" autocomplete="username"></label><label>Contraseña<input id="loginPassword" type="password" autocomplete="current-password"></label><button id="loginButton">Ingresar</button></div></section>
<section id="panel" hidden><div class="toolbar"><div><h2>Empresas</h2><p id="session"></p></div><button id="newCompany">+ Nueva empresa</button></div><div id="companies" class="companies"></div>
<form id="companyForm" class="card editor" hidden><div class="editor-title"><h2 id="formTitle">Nueva empresa</h2><button type="button" id="closeForm" class="secondary">Cerrar</button></div><input id="companyId" type="hidden"><div class="grid"><label>Código<input id="code" required placeholder="empresa1"></label><label>Nombre comercial<input id="name" required></label><label>Título<input id="title" required></label><label>Subtítulo<input id="subtitle"></label><label>Dominio<input id="domain" placeholder="pedidos.empresa.com"></label><label>Logo URL<input id="logo" placeholder="/clientes/empresa/logo.svg"></label><label>Color principal<input id="primary" type="color" value="#20b3df"></label><label>Color secundario<input id="secondary" type="color" value="#10213c"></label><label>Referencia conexión<input id="connectionReference" placeholder="SQL Empresa"></label><label>Vencimiento<input id="expiration" type="date"></label></div><label>Conexión SQL (solo completar para crear o reemplazar)<textarea id="connection" rows="3" autocomplete="off"></textarea></label><div class="checks"><label><input id="perception" type="checkbox" checked> Percepción IIBB</label><label><input id="subtotals" type="checkbox" checked> Subtotales en PDF</label><label><input id="enabled" type="checkbox" checked> Empresa habilitada</label></div><h3>Funciones</h3><div class="checks"><label><input id="multiple" type="checkbox" checked> Carga múltiple</label><label><input id="tracking" type="checkbox" checked> Seguimiento</label><label><input id="locations" type="checkbox" checked> Ubicación de clientes</label><label><input id="pdf" type="checkbox" checked> PDF de pedidos</label></div><div class="actions"><button type="submit">Guardar empresa</button><button id="testConnection" type="button" class="secondary">Probar conexión</button></div></form></section>
<section id="usersPanel" class="card editor users-panel" hidden><div class="editor-title"><div><h2>Usuarios · <span id="usersCompany"></span></h2><p>Usuarios propios de esta empresa</p></div><button type="button" id="closeUsers" class="secondary">Cerrar</button></div><input id="usersCompanyId" type="hidden"><form id="userForm" class="user-form"><label>Usuario<input id="userName" required></label><label>Nombre<input id="userDisplayName" required></label><label>Clave inicial<span class="password-input"><input id="userPassword" type="password" minlength="6" required><button type="button" class="show-password" data-target="userPassword">Ver</button></span></label><label>Repetir clave<input id="userPasswordConfirm" type="password" minlength="6" required></label><label>Rol<select id="userRole"><option value="V">V · Vendedor</option><option value="A">A · Administrador</option><option value="P">P · Consulta pedidos</option><option value="S">S · Consulta ventas</option><option value="Q">Q · Todo menos usuarios</option></select></label><label>Cód. vendedor<input id="userSellerCode" type="number" min="1"></label><button type="submit">+ Agregar</button></form><div class="users-table-wrap"><table class="users-table"><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Vendedor</th><th class="center">Habilitado</th><th></th></tr></thead><tbody id="companyUsers"></tbody></table></div></section>
<dialog id="passwordDialog" class="password-dialog"><form id="passwordForm"><div class="dialog-title"><h3>Cambiar clave</h3><button type="button" id="closePassword" class="icon-close" aria-label="Cerrar">×</button></div><input id="passwordUserId" type="hidden"><label>Nueva clave<span class="password-input"><input id="newPassword" type="password" minlength="6" required><button type="button" class="show-password" data-target="newPassword">Ver</button></span></label><label>Repetir nueva clave<input id="confirmPassword" type="password" minlength="6" required></label><div class="dialog-actions"><button type="button" id="cancelPassword" class="secondary">Cancelar</button><button type="submit">Guardar clave</button></div></form></dialog>
<dialog id="validationDialog" class="validation-dialog"><div class="dialog-title"><div><h3>Validación · <span id="validationCompany"></span></h3><p id="validationSummary"></p></div><button type="button" id="closeValidation" class="icon-close" aria-label="Cerrar">×</button></div><div id="validationResults" class="validation-results"></div><div class="dialog-actions"><button type="button" id="closeValidationBottom" class="secondary">Cerrar</button></div></dialog>
<div id="message" class="message"></div></main><script src="app.js"></script></body></html>
